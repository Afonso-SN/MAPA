server.port=8080
server.address=0.0.0.0

# Banco SQLite (cria o arquivo mapa.db automaticamente na pasta backend)
spring.datasource.url=jdbc:sqlite:mapa.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.community.dialects.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave secreta do JWT
api.jwt.secret=chave-secreta-projeto-mapa-2026