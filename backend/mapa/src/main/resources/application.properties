spring.application.name=mapa
# Cria e conecta no arquivo mapa.db dentro da pasta backend
spring.datasource.url=jdbc:sqlite:mapa.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Traduz o Java para a linguagem do SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Cria e atualiza as tabelas automaticamente a partir das classes Java
spring.jpa.hibernate.ddl-auto=update

# Mostra no terminal os comandos SQL executados (ótimo para aprender e debugar)
spring.jpa.show-sql=true

# Evita travamento de escrita simultânea no arquivo do SQLite
spring.datasource.hikari.maximum-pool-size=1
